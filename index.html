<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal | Root Access</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Matrix rain canvas -->
    <canvas id="matrix-canvas"></canvas>
    
    <!-- CRT monitor effect -->
    <div class="crt-overlay"></div>

    <div class="card">
        <!-- User info -->
        <h1 class="name">INSIDIOUS</h1>
        
        <div class="typewriter-container">
            <h2 class="title">> OSINT & Ethical Hacking</h2>
        </div>
        
        <p class="description">
            Специализируюсь на поиске информации в открытых источниках, анализе безопасности и защите данных. 
            Исследую системы, нахожу уязвимости, пишу код.
        </p>
        
        <!-- Social links -->
        <div class="links">
            <a href="https://github.com/AndreyDarik" target="_blank" class="btn">
                <span class="btn-text">[ GitHub ]</span>
            </a>
            <a href="mailto:andreidarik19@gmail.com" class="btn">
                <span class="btn-text">[ Email ]</span>
            </a>
        </div>
    </div>

    <!-- MAIN SCRIPT -->
    <script>
        // Get canvas and context
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size to full screen
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // 1. CONFIG: Words to drop
        const phrases = [
            'OSINT', 'HACKING', 'INSIDIOUS', 'SECURITY', 
            'ROOT', 'ACCESS', 'CYBER', 'EXPLOIT', 'DATA', 'LINUX'
        ];

        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);

        // Array for drop data
        let drops = [];
        
        // Init drop positions
        function initDrops() {
            drops = [];
            for (let x = 0; x < columns; x++) {
                drops.push({
                    y: Math.random() * (canvas.height / fontSize), // Random start Y
                    phrase: phrases[Math.floor(Math.random() * phrases.length)], // Random word
                    charIndex: 0 // Start from first char
                });
            }
        }
        
        initDrops();

        const draw = () => {
            // Fade effect for trails
            ctx.fillStyle = 'rgba(13, 17, 23, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Text style
            ctx.fillStyle = '#58a6ff'; 
            ctx.font = fontSize + 'px monospace';

            // Draw each column
            for (let i = 0; i < drops.length; i++) {
                const drop = drops[i];
                const text = drop.phrase.charAt(drop.charIndex);
                
                ctx.fillText(text, i * fontSize, drop.y * fontSize);

                // Move to next char
                drop.charIndex++;
                if (drop.charIndex >= drop.phrase.length) {
                    drop.charIndex = 0;
                }

                // Reset drop to top randomly
                if (drop.y * fontSize > canvas.height && Math.random() > 0.975) {
                    drop.y = 0;
                    drop.phrase = phrases[Math.floor(Math.random() * phrases.length)];
                    drop.charIndex = 0;
                } else {
                    drop.y++;
                }
            }
        };

        // 2. CONFIG: Speed (ms)
        setInterval(draw, 60);

        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            columns = Math.floor(canvas.width / fontSize);
            initDrops();
        });
    </script>
</body>
</html>
