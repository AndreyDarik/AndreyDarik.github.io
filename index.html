<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal | Root Access</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Matrix rain canvas (Фон) -->
    <canvas id="matrix-canvas"></canvas>
    
    <!-- CRT monitor effect (Мерцание) -->
    <div class="crt-overlay"></div>

    <!-- NEW: Wrapper to protect the layout (Контейнер, защищающий верстку) -->
    <main class="content-wrapper">
        <div class="card">
            <!-- User info -->
            <h1 class="name">INSIDIOUS</h1>
            
            <div class="typewriter-container">
                <h2 class="title">> OSINT & Ethical Hacking</h2>
            </div>
            
            <p class="description">
                Специализируюсь на поиске информации в открытых источниках, анализе безопасности и защите данных. 
                Исследую системы, нахожу уязвимости, пишу код.
            </p>
            
            <!-- Social links -->
            <div class="links">
                <a href="https://github.com/AndreyDarik" target="_blank" class="btn">
                    <span class="btn-text">[ GitHub ]</span>
                </a>
                <a href="mailto:andreidarik19@gmail.com" class="btn">
                    <span class="btn-text">[ Email ]</span>
                </a>
            </div>
        </div>
    </main>

    <!-- MAIN SCRIPT (JavaScript) -->
    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const phrases = [
            'OSINT', 'HACKING', 'INSIDIOUS', 'SECURITY', 
            'ROOT', 'ACCESS', 'CYBER', 'EXPLOIT', 'DATA', 'LINUX'
        ];

        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = [];
        
        function initDrops() {
            drops = [];
            for (let x = 0; x < columns; x++) {
                drops.push({
                    y: Math.random() * (canvas.height / fontSize), 
                    phrase: phrases[Math.floor(Math.random() * phrases.length)],
                    charIndex: 0 
                });
            }
        }
        
        initDrops();

        // Настройки таймера для плавной анимации
        let lastTime = 0;
        let timer = 0;
        
        // --- НАСТРОЙКА СКОРОСТИ ---
        // Чем больше число, тем медленнее падают слова (например, 150 - очень медленно, 50 - быстро)
        const animationSpeed = 120; 

        // Новая функция анимации, использующая requestAnimationFrame
        function animate(timeStamp) {
            // Вычисляем, сколько миллисекунд прошло с прошлого кадра
            const deltaTime = timeStamp - lastTime;
            lastTime = timeStamp;

            // Если прошло достаточно времени, рисуем следующий шаг
            if (timer > animationSpeed) {
                // Fade effect
                ctx.fillStyle = 'rgba(13, 17, 23, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#58a6ff'; 
                ctx.font = fontSize + 'px monospace';

                for (let i = 0; i < drops.length; i++) {
                    const drop = drops[i];
                    const text = drop.phrase.charAt(drop.charIndex);
                    
                    ctx.fillText(text, i * fontSize, drop.y * fontSize);

                    drop.charIndex++;
                    if (drop.charIndex >= drop.phrase.length) {
                        drop.charIndex = 0;
                    }

                    if (drop.y * fontSize > canvas.height && Math.random() > 0.975) {
                        drop.y = 0;
                        drop.phrase = phrases[Math.floor(Math.random() * phrases.length)];
                        drop.charIndex = 0;
                    } else {
                        drop.y++;
                    }
                }
                timer = 0; // Сбрасываем таймер после отрисовки
            } else {
                // Иначе просто накапливаем время
                timer += deltaTime;
            }

            // Запрашиваем следующий кадр у браузера
            requestAnimationFrame(animate);
        }

        // Запускаем анимацию
        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            columns = Math.floor(canvas.width / fontSize);
            initDrops();
        });
    </script>
</body>
</html>
